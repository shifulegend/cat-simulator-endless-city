# CI workflow — HTML/JS syntax validation + Playwright smoke tests
# Docs: https://docs.github.com/en/actions

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Least-privilege permissions — expand only what you need
permissions:
  contents: read

jobs:
  ci:
    name: Validate · Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Syntax check ─────────────────────────────────────────────────────
      - name: Extract and check inline JS syntax
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf-8');
            const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            scripts.forEach((m, i) => {
              fs.writeFileSync('_check_' + i + '.js', m[1]);
            });
          "
          for f in _check_*.js; do node --check "$f"; done

      # ── Setup Python + Playwright for smoke tests ──────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # ── Smoke test ──────────────────────────────────────────────────────────
      - name: Serve site and run smoke test
        run: |
          python3 -m http.server 8000 &
          sleep 2
          python3 -c "
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page()
                  errors = []
                  page.on('pageerror', lambda exc: errors.append(str(exc)))
                  await page.goto('http://localhost:8000', wait_until='domcontentloaded')
                  await page.click('#startBtn')
                  await page.wait_for_timeout(1500)
                  await page.keyboard.down('KeyW')
                  await page.wait_for_timeout(800)
                  await page.keyboard.up('KeyW')
                  assert not errors, f'JS errors detected: {errors}'
                  await browser.close()

          asyncio.run(main())
          print('Smoke test passed')
          "
